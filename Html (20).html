<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบตารางเวลาประจำสัปดาห์</title>
    <!-- โหลดไลบรารีผ่าน CDN (ใช้งานได้สมบูรณ์เมื่อรันผ่าน GitHub Pages / เว็บออนไลน์) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap');
        
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 10px;
        }

        .form-container {
            max-width: 600px;
            background: white;
            padding: 15px;
            margin: 0 auto;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .form-container h2 {
            font-size: 18px;
            margin-top: 0;
            color: #2e7d32;
            border-bottom: 2px solid #2e7d32;
            padding-bottom: 8px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            font-family: 'Sarabun', sans-serif;
            background-color: #fff;
        }

        .day-card {
            background: #fafafa;
            border: 1px solid #ddd;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 12px;
        }

        .day-card h4 {
            margin: 0 0 8px 0;
            color: #1b5e20;
            font-size: 16px;
            border-bottom: 1px dashed #ccc;
            padding-bottom: 4px;
        }

        .day-card label {
            font-size: 13px;
            color: #444;
            display: block;
            margin-top: 6px;
            font-weight: 600;
        }

        .day-card textarea {
            width: 100%;
            height: 60px;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            font-family: 'Sarabun', sans-serif;
            resize: vertical;
            background-color: #fff;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-submit {
            background-color: #2e7d32;
            color: white;
            padding: 14px;
            font-size: 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 50%;
            font-weight: 600;
        }

        .btn-pdf {
            background-color: #d32f2f;
        }

        .btn-submit:active {
            opacity: 0.8;
        }

        /* ซ่อนแม่แบบไว้ข้างนอกจอตอนแปลงไฟล์ */
        .image-wrapper {
            position: absolute;
            left: -9999px;
            top: 0;
        }

        #capture-container {
            width: 1488px;
            height: 1050px;
            padding: 60px 75px;
            background: white;
            box-sizing: border-box;
            position: relative;
        }

        .header-title {
            text-align: center;
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 22px;
            font-size: 21px;
        }

        .info-line {
            border-bottom: 2px dotted #000;
            display: inline-block;
            min-width: 350px;
            padding: 0 10px;
        }

        .logo-box {
            width: 75px;
            height: 75px;
            border: 2px solid #333;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            text-align: center;
            line-height: 1.1;
        }

        table.schedule-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 17px;
        }

        table.schedule-table th, table.schedule-table td {
            border: 2px solid #000;
            padding: 10px;
            text-align: center;
            vertical-align: middle;
            height: 150px;
        }

        table.schedule-table th {
            background-color: #f2f2f2;
            font-weight: 600;
            height: 60px;
        }

        .cell-content {
            text-align: left;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            white-space: pre-line;
            overflow: hidden;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>ตารางเวลาประจำสัปดาห์ ( ค.ศ. )</h2>
        
        <div class="input-group">
            <label>ชื่อ-นามสกุล:</label>
            <input type="text" id="input-name" placeholder="ระบุชื่อของคุณ">
        </div>

        <div class="input-group">
            <label>วันที่เริ่มต้นสัปดาห์ (วันอาทิตย์ ค.ศ.):</label>
            <input type="date" id="input-start-date">
        </div>

        <h3 style="font-size: 16px; margin: 15px 0 10px 0; color: #333;">กรอกกิจกรรมแต่ละวัน</h3>

        <!-- ช่องกรอกแต่ละวัน -->
        <div class="day-card"><h4>วันอาทิตย์</h4><label>เช้า:</label><textarea id="sun-m"></textarea><label>บ่าย:</label><textarea id="sun-a"></textarea><label>เย็น:</label><textarea id="sun-e"></textarea><label>กิจกรรมพิเศษ:</label><textarea id="sun-s"></textarea></div>
        <div class="day-card"><h4>วันจันทร์</h4><label>เช้า:</label><textarea id="mon-m"></textarea><label>บ่าย:</label><textarea id="mon-a"></textarea><label>เย็น:</label><textarea id="mon-e"></textarea><label>กิจกรรมพิเศษ:</label><textarea id="mon-s"></textarea></div>
        <div class="day-card"><h4>วันอังคาร</h4><label>เช้า:</label><textarea id="tue-m"></textarea><label>บ่าย:</label><textarea id="tue-a"></textarea><label>เย็น:</label><textarea id="tue-e"></textarea><label>กิจกรรมพิเศษ:</label><textarea id="tue-s"></textarea></div>
        <div class="day-card"><h4>วันพุธ</h4><label>เช้า:</label><textarea id="wed-m"></textarea><label>บ่าย:</label><textarea id="wed-a"></textarea><label>เย็น:</label><textarea id="wed-e"></textarea><label>กิจกรรมพิเศษ:</label><textarea id="wed-s"></textarea></div>
        <div class="day-card"><h4>วันพฤหัสบดี</h4><label>เช้า:</label><textarea id="thu-m"></textarea><label>บ่าย:</label><textarea id="thu-a"></textarea><label>เย็น:</label><textarea id="thu-e"></textarea><label>กิจกรรมพิเศษ:</label><textarea id="thu-s"></textarea></div>
        <div class="day-card"><h4>วันศุกร์</h4><label>เช้า:</label><textarea id="fri-m"></textarea><label>บ่าย:</label><textarea id="fri-a"></textarea><label>เย็น:</label><textarea id="fri-e"></textarea><label>กิจกรรมพิเศษ:</label><textarea id="fri-s"></textarea></div>
        <div class="day-card"><h4>วันเสาร์</h4><label>เช้า:</label><textarea id="sat-m"></textarea><label>บ่าย:</label><textarea id="sat-a"></textarea><label>เย็น:</label><textarea id="sat-e"></textarea><label>กิจกรรมพิเศษ:</label><textarea id="sat-s"></textarea></div>

        <div class="btn-group">
            <button class="btn-submit" onclick="exportFile('jpg')">📥 ดาวน์โหลด JPG</button>
            <button class="btn-submit btn-pdf" onclick="exportFile('pdf')">📥 ดาวน์โหลด PDF</button>
        </div>
    </div>

    <!-- ส่วนแม่แบบซ่อนไว้นอกจอ -->
    <div class="image-wrapper">
        <div id="capture-container">
            <div class="header-title">ตารางเวลาประจำสัปดาห์</div>
            
            <div class="info-row">
                <div>
                    ชื่อ: <span class="info-line" id="out-name"></span><br><br>
                    วันที่: <span class="info-line" id="out-date"></span>
                </div>
                <div class="logo-box">
                    JDM<br><span style="font-size: 10px;">2004THAI</span>
                </div>
            </div>

            <table class="schedule-table">
                <tr>
                    <th style="width: 11%;">เวลา \ วัน</th>
                    <th style="width: 12.7%;">อาทิตย์<br><span id="d-sun" style="font-weight: normal; font-size: 15px;"></span></th>
                    <th style="width: 12.7%;">จันทร์<br><span id="d-mon" style="font-weight: normal; font-size: 15px;"></span></th>
                    <th style="width: 12.7%;">อังคาร<br><span id="d-tue" style="font-weight: normal; font-size: 15px;"></span></th>
                    <th style="width: 12.7%;">พุธ<br><span id="d-wed" style="font-weight: normal; font-size: 15px;"></span></th>
                    <th style="width: 12.7%;">พฤหัสบดี<br><span id="d-thu" style="font-weight: normal; font-size: 15px;"></span></th>
                    <th style="width: 12.7%;">ศุกร์<br><span id="d-fri" style="font-weight: normal; font-size: 15px;"></span></th>
                    <th style="width: 12.7%;">เสาร์<br><span id="d-sat" style="font-weight: normal; font-size: 15px;"></span></th>
                </tr>
                <tr>
                    <td style="font-weight: 600;">เช้า</td>
                    <td><div class="cell-content" id="out-sun-m"></div></td>
                    <td><div class="cell-content" id="out-mon-m"></div></td>
                    <td><div class="cell-content" id="out-tue-m"></div></td>
                    <td><div class="cell-content" id="out-wed-m"></div></td>
                    <td><div class="cell-content" id="out-thu-m"></div></td>
                    <td><div class="cell-content" id="out-fri-m"></div></td>
                    <td><div class="cell-content" id="out-sat-m"></div></td>
                </tr>
                <tr>
                    <td style="font-weight: 600;">บ่าย</td>
                    <td><div class="cell-content" id="out-sun-a"></div></td>
                    <td><div class="cell-content" id="out-mon-a"></div></td>
                    <td><div class="cell-content" id="out-tue-a"></div></td>
                    <td><div class="cell-content" id="out-wed-a"></div></td>
                    <td><div class="cell-content" id="out-thu-a"></div></td>
                    <td><div class="cell-content" id="out-fri-a"></div></td>
                    <td><div class="cell-content" id="out-sat-a"></div></td>
                </tr>
                <tr>
                    <td style="font-weight: 600;">เย็น</td>
                    <td><div class="cell-content" id="out-sun-e"></div></td>
                    <td><div class="cell-content" id="out-mon-e"></div></td>
                    <td><div class="cell-content" id="out-tue-e"></div></td>
                    <td><div class="cell-content" id="out-wed-e"></div></td>
                    <td><div class="cell-content" id="out-thu-e"></div></td>
                    <td><div class="cell-content" id="out-fri-e"></div></td>
                    <td><div class="cell-content" id="out-sat-e"></div></td>
                </tr>
                <tr>
                    <td style="font-weight: 600;">กิจกรรมพิเศษ</td>
                    <td><div class="cell-content" id="out-sun-s"></div></td>
                    <td><div class="cell-content" id="out-mon-s"></div></td>
                    <td><div class="cell-content" id="out-tue-s"></div></td>
                    <td><div class="cell-content" id="out-wed-s"></div></td>
                    <td><div class="cell-content" id="out-thu-s"></div></td>
                    <td><div class="cell-content" id="out-fri-s"></div></td>
                    <td><div class="cell-content" id="out-sat-s"></div></td>
                </tr>
            </table>

            <div style="position: absolute; right: 75px; bottom: 40px; text-align: center; font-size: 19px;">
                ชื่อ <span style="border-bottom: 2px dotted #000; width: 220px; display: inline-block;"></span> ผู้นำ<br>
                วันที่ <span style="border-bottom: 2px dotted #000; width: 220px; display: inline-block;"></span>
            </div>
        </div>
    </div>

    <script>
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        document.getElementById('input-start-date').value = `${yyyy}-${mm}-${dd}`;

        const daysList = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];

        function prepareData() {
            const name = document.getElementById('input-name').value;
            const startDateVal = document.getElementById('input-start-date').value;

            if(!name || !startDateVal) {
                alert('กรุณากรอกชื่อและเลือกวันที่เริ่มต้นสัปดาห์ก่อนครับ');
                return null;
            }

            const [year, month, day] = startDateVal.split('-').map(Number);
            let startDate = new Date(year, month - 1, day);

            let dates = [];
            for(let i=0; i<7; i++) {
                let d = new Date(year, month - 1, day + i);
                dates.push(d.getDate());
            }

            document.getElementById('d-sun').innerText = dates[0];
            document.getElementById('d-mon').innerText = dates[1];
            document.getElementById('d-tue').innerText = dates[2];
            document.getElementById('d-wed').innerText = dates[3];
            document.getElementById('d-thu').innerText = dates[4];
            document.getElementById('d-fri').innerText = dates[5];
            document.getElementById('d-sat').innerText = dates[6];

            document.getElementById('out-name').innerText = name;
            
            let formattedStartDate = startDate.toLocaleDateString('en-GB', { year: 'numeric', month: '2-digit', day: '2-digit' });
            document.getElementById('out-date').innerText = formattedStartDate;

            daysList.forEach(dayId => {
                ['m', 'a', 'e', 's'].forEach(slot => {
                    let val = document.getElementById(`${dayId}-${slot}`).value;
                    let cell = document.getElementById(`out-${dayId}-${slot}`);
                    cell.innerText = val;

                    if (val.length > 80) {
                        cell.style.fontSize = '11px';
                    } else if (val.length > 40) {
                        cell.style.fontSize = '13px';
                    } else {
                        cell.style.fontSize = '17px';
                    }
                });
            });

            let safeDateStr = formattedStartDate.replace(/\//g, '-');
            return `รายงานประจำสัปดาห์ชื่อ ${name} วันที่ ${safeDateStr}`;
        }

        function exportFile(type) {
            let baseFileName = prepareData();
            if (!baseFileName) return;

            const container = document.getElementById('capture-container');
            
            html2canvas(container, { scale: 2, useCORS: true }).then(canvas => {
                if (type === 'jpg') {
                    const link = document.createElement('a');
                    link.download = `${baseFileName}.jpg`;
                    link.href = canvas.toDataURL('image/jpeg', 0.95);
                    link.click();
                } else if (type === 'pdf') {
                    const { jsPDF } = window.jspdf;
                    const pdf = new jsPDF('l', 'mm', 'a4');
                    const imgData = canvas.toDataURL('image/jpeg', 0.95);
                    pdf.addImage(imgData, 'JPEG', 0, 0, 297, 210);
                    pdf.save(`${baseFileName}.pdf`);
                }
            });
        }
    </script>

</body>
</html>
